<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4 — District Population Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #1A1F2E; color: #eee; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        #sidebar { width: 320px; min-width: 320px; padding: 16px; background: #141824; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; border-right: 1px solid #2a2f40; }
        #sidebar h1 { font-size: 1.1em; color: #C53030; display: flex; align-items: center; gap: 8px; }
        #sidebar h1 span { font-size: 0.7em; background: #C53030; color: #fff; padding: 2px 6px; border-radius: 3px; }
        .section-header { font-size: 0.8em; color: #C53030; margin-top: 6px; border-top: 1px solid #2a2f40; padding-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; }
        .section-header::before { content: '\25BE '; font-size: 0.7em; }
        .section-header.collapsed::before { content: '\25B8 '; }
        .section-content { display: flex; flex-direction: column; gap: 8px; }
        .section-content.hidden { display: none; }
        label { display: block; font-size: 0.8em; margin-bottom: 2px; color: #8890a4; }
        input[type="number"], select, input[type="range"] { width: 100%; padding: 7px 8px; border: 1px solid #2a2f40; border-radius: 4px; background: #1e2436; color: #eee; font-size: 0.9em; }
        input[type="number"]:focus, select:focus { border-color: #C53030; outline: none; }
        input[type="range"] { padding: 4px 0; background: transparent; border: none; }
        button { padding: 9px; border: none; border-radius: 4px; background: #C53030; color: #fff; font-size: 0.9em; cursor: pointer; width: 100%; }
        button:hover { background: #a82828; }
        button.secondary { background: #1e2436; border: 1px solid #2a2f40; font-size: 0.8em; padding: 6px 8px; }
        button.secondary:hover { background: #2a3050; }
        .row { display: flex; gap: 8px; }
        .row > div { flex: 1; }
        .slider-row { display: flex; align-items: center; gap: 8px; }
        .slider-row input[type="range"] { flex: 1; }
        .slider-row .slider-val { font-size: 0.75em; color: #8890a4; min-width: 32px; text-align: right; }

        /* Layer toggles */
        .layer-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.8em; color: #8890a4; cursor: pointer; }
        .layer-toggle input[type="checkbox"] { accent-color: #C53030; }

        /* Status bar */
        #status-bar { font-size: 0.75em; color: #555; margin-top: auto; padding-top: 8px; border-top: 1px solid #2a2f40; }

        /* Main canvas area */
        #canvas-area { flex: 1; position: relative; overflow: hidden; cursor: grab; user-select: none; background: #1A1F2E; }
        #canvas-area.grabbing { cursor: grabbing; }
        canvas { position: absolute; top: 0; left: 0; }

        /* Tooltip */
        #tooltip { position: absolute; background: #141824ee; border: 1px solid #2a2f40; padding: 6px 10px; border-radius: 4px; font-size: 0.8em; pointer-events: none; display: none; z-index: 100; color: #ccc; }

        /* Import panel */
        #import-panel { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #141824; border: 1px solid #2a2f40; border-radius: 8px; padding: 24px; z-index: 200; min-width: 400px; }
        #import-panel h2 { font-size: 1em; color: #C53030; margin-bottom: 12px; }
        #import-panel textarea { width: 100%; height: 180px; background: #1e2436; color: #aaa; border: 1px solid #2a2f40; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 0.75em; resize: vertical; }
        #import-overlay { display: none; position: absolute; inset: 0; background: #00000088; z-index: 199; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .btn-row button { flex: 1; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>District Population <span>M4</span></h1>

        <!-- Polygon shape -->
        <div class="section-header" data-section="shape">District Shape</div>
        <div class="section-content" id="sec-shape">
            <div class="row">
                <div>
                    <label for="preset">Preset Shape</label>
                    <select id="preset">
                        <option value="default">Rectangle</option>
                        <option value="hexagon">Hexagon</option>
                        <option value="elongated">Elongated</option>
                        <option value="irregular">Irregular</option>
                        <option value="large">Large</option>
                    </select>
                </div>
                <div>
                    <label for="district-type">District Type</label>
                    <select id="district-type">
                        <option value="craftsmen">Craftsmen</option>
                        <option value="merchant">Merchant</option>
                        <option value="patriciate">Patriciate</option>
                        <option value="residential">Residential</option>
                        <option value="slum">Slum</option>
                        <option value="market">Market</option>
                        <option value="cathedral">Cathedral</option>
                        <option value="castle">Castle</option>
                        <option value="military">Military</option>
                        <option value="farm">Farm</option>
                        <option value="park">Park</option>
                    </select>
                </div>
            </div>
            <button class="secondary" id="import-polygon-btn">Import Polygon JSON</button>
            <button class="secondary" id="import-citymap-btn">Import from CityMap</button>
        </div>

        <!-- Populator selection -->
        <div class="section-header" data-section="populator">Populator</div>
        <div class="section-content" id="sec-populator">
            <label for="populator">Algorithm</label>
            <select id="populator">
                <option value="auto">(auto — based on type + style)</option>
            </select>
            <div class="row">
                <div>
                    <label for="style">Cultural Style</label>
                    <select id="style">
                        <option value="generic">Generic</option>
                        <option value="european_medieval">European Medieval</option>
                        <option value="arabic_islamic">Arabic / Islamic</option>
                        <option value="east_asian">East Asian</option>
                        <option value="roman">Roman</option>
                        <option value="norse">Norse</option>
                        <option value="mongol">Mongol</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Generation params -->
        <div class="section-header" data-section="params">Parameters</div>
        <div class="section-content" id="sec-params">
            <div class="row">
                <div>
                    <label for="seed">Seed</label>
                    <input type="number" id="seed" value="42" min="1">
                </div>
                <div style="display:flex;align-items:flex-end;">
                    <button class="secondary" id="random" style="margin-bottom:0;">Random</button>
                </div>
            </div>

            <label>Min Building Area: <span id="min-area-val" class="slider-val">20</span></label>
            <div class="slider-row">
                <input type="range" id="min-area" min="5" max="100" step="1" value="20">
            </div>

            <label>Grid Chaos: <span id="grid-chaos-val" class="slider-val">0.40</span></label>
            <div class="slider-row">
                <input type="range" id="grid-chaos" min="0" max="1" step="0.05" value="0.4">
            </div>

            <label>Size Chaos: <span id="size-chaos-val" class="slider-val">0.40</span></label>
            <div class="slider-row">
                <input type="range" id="size-chaos" min="0" max="1" step="0.05" value="0.4">
            </div>

            <label>Density: <span id="density-val" class="slider-val">0.60</span></label>
            <div class="slider-row">
                <input type="range" id="density" min="0" max="1" step="0.05" value="0.6">
            </div>

            <label>Empty Lot Prob: <span id="empty-prob-val" class="slider-val">0.04</span></label>
            <div class="slider-row">
                <input type="range" id="empty-prob" min="0" max="0.3" step="0.01" value="0.04">
            </div>

            <label>Alley Width: <span id="alley-width-val" class="slider-val">0.80</span></label>
            <div class="slider-row">
                <input type="range" id="alley-width" min="0.2" max="3.0" step="0.1" value="0.8">
            </div>
        </div>

        <button id="generate">Generate Buildings</button>

        <!-- Layer toggles -->
        <div class="section-header" data-section="layers">Layers</div>
        <div class="section-content" id="sec-layers">
            <label class="layer-toggle"><input type="checkbox" id="layer-boundary" checked> District boundary</label>
            <label class="layer-toggle"><input type="checkbox" id="layer-buildings" checked> Buildings</label>
            <label class="layer-toggle"><input type="checkbox" id="layer-alleys" checked> Alleys / courtyards</label>
            <label class="layer-toggle"><input type="checkbox" id="layer-labels" checked> Building labels</label>
            <label class="layer-toggle"><input type="checkbox" id="layer-debug"> Debug info</label>
        </div>

        <div class="row">
            <button class="secondary" id="export-btn">Export JSON</button>
            <button class="secondary" id="reset-zoom">Reset View</button>
        </div>

        <div id="status-bar">Ready — click Generate to populate district</div>
    </div>

    <div id="canvas-area">
        <canvas id="canvas-main"></canvas>
        <div id="tooltip"></div>
    </div>

    <!-- Import polygon panel -->
    <div id="import-overlay"></div>
    <div id="import-panel">
        <h2>Import Polygon</h2>
        <p style="font-size:0.8em; color:#666; margin-bottom:8px;">
            Paste a JSON array of [x,y] points, or a full CityMap JSON to pick a district.
        </p>
        <textarea id="import-text" placeholder='[[0,0],[50,0],[50,40],[0,40]]'></textarea>
        <div id="citymap-district-picker" style="display:none; margin-top:8px;">
            <label for="pick-district">Select District</label>
            <select id="pick-district"></select>
        </div>
        <div class="btn-row">
            <button id="import-apply">Apply</button>
            <button class="secondary" id="import-cancel">Cancel</button>
        </div>
    </div>

    <script src="/static/district.js"></script>
</body>
</html>
